name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          # The browser tests don't run in CI yet, so skip the large Cypress download.
          CYPRESS_INSTALL_BINARY: '0'
      - run: npm run check
      - run: npm run test:api
        timeout-minutes: 5
